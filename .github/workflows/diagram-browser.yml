name: Diagram browser tests

on:
  pull_request:
    paths:
      - 'skills/create-diagram/**'
      - 'scripts/test/diagram-*'
      - 'scripts/test/helpers/**'
      - '.github/workflows/diagram-browser.yml'
  push:
    branches: [main]
    paths:
      - 'skills/create-diagram/**'
      - 'scripts/test/diagram-*'
      - 'scripts/test/helpers/**'
      - '.github/workflows/diagram-browser.yml'

permissions:
  contents: read

jobs:
  browser:
    # Pinned: Playwright 1.56.1 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm i --no-save @playwright/test@1.56.1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-ubuntu-24.04

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Liberation fonts
        run: fc-list | grep -i liberation

      - name: Run diagram tests
        env:
          REQUIRE_CHROMIUM: '1'
        run: node --test "scripts/test/diagram-*.test.mjs"
