apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: orders-resiliency
scopes:
  - orders-subscriber
spec:
  policies:
    retries:
      pubsubRetry:
        policy: constant
        duration: 5s
        maxRetries: 5
  targets:
    components:
      pubsub:
        inbound:
          retry: pubsubRetry
