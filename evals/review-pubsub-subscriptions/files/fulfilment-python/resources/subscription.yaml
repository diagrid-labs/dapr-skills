apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: payments-subscription
spec:
  pubsubname: pubsub
  topic: payments
  routes:
    rules:
      - match: event.data.priority > 2 # SEED DPS-SUB-012
        path: /events/pubsub/payments/urgent # SEED DPS-SUB-015
    default: /events/pubsub/payments
  deadLetterTopic: payments-dead # SEED DPS-SUB-009
scopes:
  - api
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: invoices-subscription
spec:
  pubsubname: pubsub
  topic: invoices
  routes:
    default: /events/pubsub/invoices
scopes:
  - worker
