apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: orders-subscription
spec:
  pubsubname: pubsub
  topic: orders
  routes:
    default: /events/pubsub/orders
  deadLetterTopic: orders-deadletter
scopes:
  - fulfilment-api
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: shipments-subscription
spec:
  pubsubname: pubsub
  topic: shipments
  routes:
    rules:
      - match: int(event.data.weight) > 30
        path: /events/pubsub/shipments/heavy
    default: /events/pubsub/shipments
  deadLetterTopic: shipments-dead
scopes:
  - fulfilment-api
