apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: orders-subscription
spec:
  pubsubname: pubsub
  topic: orders
  routes:
    rules:
      - match: int(event.data.amount) > 1000
        path: /events/pubsub/orders/large
    default: /events/pubsub/orders
  deadLetterTopic: orders-deadletter
scopes:
  - clean-declarative
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: orders-deadletter-subscription
spec:
  pubsubname: pubsub
  topic: orders-deadletter
  routes:
    default: /events/pubsub/orders-deadletter
scopes:
  - clean-declarative
